services:
  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      - POSTGRES_USER=kratos
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=kratos
    volumes:
      - /datadrive/taksa/postgres:/var/lib/postgresql
    networks:
      - taksa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kratos"]
      interval: 5s
      timeout: 5s
      retries: 5

  kratos-migrate:
    image: oryd/kratos:v1.2.0
    environment:
      - DSN=postgres://kratos:secret@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
    volumes:
      - ./ory-stack/kratos-config:/etc/config/kratos
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    networks:
      - taksa-network
    depends_on:
      postgres:
        condition: service_healthy

  kratos:
    image: oryd/kratos:v1.2.0
    container_name: kratos
    ports:
      - '172.25.61.228:4433:4433'
      - '172.25.61.228:4434:4434'
    environment:
      - DSN=postgres://kratos:secret@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
      - LOG_LEVEL=debug
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    volumes:
      - ./ory-stack/kratos-config:/etc/config/kratos
    networks:
      - taksa-network
    restart: unless-stopped
    depends_on:
      - kratos-migrate

  oathkeeper:
    image: oryd/oathkeeper:v0.40
    container_name: oathkeeper
    ports:
      - '172.25.61.228:4457:4455'
      - '172.25.61.228:4456:4456'
    command: serve -c /etc/config/oathkeeper/oathkeeper.yml
    volumes:
      - ./ory-stack/oathkeeper-config:/etc/config/oathkeeper
    networks:
      - taksa-network
    restart: unless-stopped
    depends_on:
      - kratos

  mailslurper:
    image: oryd/mailslurper:latest-smtps
    container_name: mailslurper
    ports:
      - '172.25.61.228:4436:4436'
      - '172.25.61.228:4437:4437'
    networks:
      - taksa-network

networks:
  taksa-network:
    driver: bridge
