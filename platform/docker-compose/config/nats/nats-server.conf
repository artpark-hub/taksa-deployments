# Enable HTTP monitoring on port 8222
http_port: 8222

# Enable JetStream
jetstream {
    # The directory where all JetStream data (streams, messages) will be stored.
    # Default is /tmp/nats/jetstream
    store_dir: "/data"

    # The maximum amount of memory allocated for 'memory' storage streams.
    # Supports units like G, M, K. Default is 75% of available RAM.
    max_mem_store: 1G

    # The maximum amount of disk space allocated for 'file' storage streams.
    # Default is 1TB if available.
    max_file_store: 100G

    # Optional: Sync interval for flushing file-based data to disk.
    # Default is 2m (2 minutes). Use "always" for highest durability.
    # sync_interval: "always"
}

accounts: {
  # System account for monitoring (no JetStream)
  $SYS: {
    users: [
      {user: $NATS_SYS_USER, password: $NATS_SYS_PASSWORD}
    ]
  }
  
  # Application account with JetStream enabled
  TAKSA: {
    jetstream: enabled
    users: [
      {user: $NATS_APP_USER, password: $NATS_APP_PASSWORD}
    ]
  }
}

