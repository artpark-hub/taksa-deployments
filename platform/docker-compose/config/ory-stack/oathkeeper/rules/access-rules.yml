# KRATOS PUBLIC API (Recovery, Settings, Verification, Login/Register Flows)
- id: kratos_public
  match:
    url: <http|https>://<.*>/self-service/<.*>
    methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
  authenticators:
    - handler: noop
  authorizer:
    handler: allow
  mutators:
    - handler: noop
  upstream:
    preserve_host: true
    strip_path: "" 
    url: http://taksa-kratos:4433

# Login endpoint - No authentication needed
- id: login_user
  match:
    url: <http|https>://<.*>/api/v1/um/login
    methods: [POST, OPTIONS]
  authenticators:
    - handler: noop
  authorizer:
    handler: allow
  mutators:
    - handler: noop
  upstream:
    preserve_host: false
    strip_path: ""
    url: http://host.docker.internal:8083

