# Public endpoint - Master user registration 
- id: register_master
  match:
    url: <http|https>://<.*>/api/v1/um/register_master_user
    methods: [POST, OPTIONS]
  authenticators:
    - handler: noop
  authorizer:
    handler: allow
  mutators:
    - handler: noop
  upstream:
    preserve_host: false
    strip_path: ""
    url: http://taksa-user-services:8083

# Token exchange endpoint - Returns JWT token (supports both bearer token and cookie)
- id: get_jwt_token
  match:
    url: <http|https>://<.*>/api/v1/um/token
    methods: [GET, OPTIONS]
  authenticators:
    - handler: cookie_session
    - handler: bearer_token  
  authorizer:
    handler: allow
  mutators:
    - handler: id_token      
  upstream:
    preserve_host: false
    strip_path: ""
    url: http://taksa-user-services:8083

