    preserve_host: false
    strip_path: ""
    url: http://host.docker.internal:8083

- id: delete_master_user
  match:
    url: <http|https>://<.*>/api/v1/um/delete_master_user/<.*>
    methods: [DELETE, OPTIONS]
  authenticators:
    - handler: cookie_session
