# Public endpoint - Master user registration 
- id: register_master
  match:
    url: <http|https>://<.*>/api/v1/um/register_master_user
    methods: [POST, OPTIONS]
  authenticators:
    - handler: noop
  authorizer:
    handler: allow
  mutators:
    - handler: noop
  upstream:
    preserve_host: false
    strip_path: ""
    url: http://host.docker.internal:8083

# Token exchange endpoint - Returns JWT token (supports both bearer token and cookie)
- id: get_jwt_token
  match:
    url: <http|https>://<.*>/api/v1/um/token
    methods: [GET, OPTIONS]
  authenticators:
    - handler: cookie_session
    - handler: bearer_token  
  authorizer:
    handler: allow
  mutators:
    - handler: id_token      
  upstream:
    preserve_host: false
    strip_path: ""
    url: http://host.docker.internal:8083

# Protected endpoint - Sub-user creation (requires JWT bearer token)
- id: create_sub_user
  match:
    url: <http|https>://<.*>/api/v1/um/create_sub_user
    methods: [POST, OPTIONS]
  authenticators:
    - handler: cookie_session
    - handler: bearer_token
  authorizer:
    handler: allow
  mutators:
    - handler: id_token
  upstream:
    preserve_host: false
    strip_path: ""
    url: http://host.docker.internal:8083

# Protected endpoint - List Sub-users 
- id: list_sub_users
  match:
    url: <http|https>://<.*>/api/v1/um/list_all_users
