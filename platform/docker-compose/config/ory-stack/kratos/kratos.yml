version: v1.2.0
dsn: postgres://kratos:secret@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
serve:
  public:
    base_url: http://172.25.60.23:4433/
    cors:
      enabled: true
      allowed_origins:
        - http://172.25.60.23:4433
        - http://172.25.60.23:4434
        - http://172.25.60.23:4457
        - http://localhost:3000
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
        - X-Session-Token
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
  admin:
    base_url: http://172.25.60.23:4434/
selfservice:
  default_browser_return_url: http://172.25.60.23:4433/
  allowed_return_urls:
    - http://172.25.60.23:4433
    - http://172.25.60.23:4434
    - http://localhost:3000
  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
        min_password_length: 8
        identifier_similarity_check_enabled: false
  flows:
    error:
      ui_url: http://172.25.60.23:4433/error
    settings:
      ui_url: http://172.25.60.23:4433/settings
      privileged_session_max_age: 15m
    recovery:
      enabled: true
      ui_url: http://172.25.60.23:4433/recovery
    verification:
      enabled: false
    logout:
      after:
        default_browser_return_url: http://172.25.60.23:4433/
    login:
      ui_url: http://172.25.60.23:4433/login
      lifespan: 10m
    registration:
      lifespan: 10m
      ui_url: http://172.25.60.23:4433/registration
      after:
        password:
          hooks:
            - hook: session
log:
  level: debug
  format: json
  leak_sensitive_values: true
# ✅ FIXED HERE
secrets:
  cookie:
    - 0123456789abcdef0123456789abcdef
  cipher:
    - a3f9c8e21d4b5678a9c0e123f456789b
ciphers:
  algorithm: xchacha20-poly1305
hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8
identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json
session:
  cookie:
    domain: 172.25.60.23
    path: /
    same_site: Lax
  lifespan: 24h
  earliest_possible_extend: 1h
  whoami:
    required_aal: aal1
courier:
  smtp:
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true