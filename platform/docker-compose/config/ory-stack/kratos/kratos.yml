version: v1.2.0
# dsn: postgres://kratos:secret@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
serve:
  public:
    # base_url: defined in the environment
    cors:
      enabled: true
      # allowed_origins:
      #   - defined in the environment
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
        - X-Session-Token
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
  # admin:
  #   base_url: defined in the environment
selfservice:
  # default_browser_return_url: defined in the environment
  # allowed_return_urls:
  #   - defined in the environment
  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
        min_password_length: 8
        identifier_similarity_check_enabled: false 
    # Enable recovery via otp
    link:
      enabled: true
      config:
        lifespan: 1h
  flows:
    # error:
    #   ui_url: defined in the environment
    settings:
      # ui_url: defined in the environment
      privileged_session_max_age: 15m
    recovery:
      enabled: true
      # ui_url: defined in the environment
      lifespan: 1h
      use: code
    verification:
      enabled: false
    login:
      # ui_url: defined in the environment
      lifespan: 10m
    registration:
      lifespan: 10m
      # ui_url: defined in the environment
      after:
        password:
          hooks:
            - hook: session
log:
  level: debug
  format: json
  leak_sensitive_values: true
secrets:
  cookie:
    - 0123456789abcdef0123456789abcdef
  cipher:
    - a3f9c8e21d4b5678a9c0e123f456789b
ciphers:
  algorithm: xchacha20-poly1305
hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8
identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json
session:
  cookie:
    #domain: defined in the environment
    path: /
    same_site: Lax
  lifespan: 24h
  earliest_possible_extend: 1h
  whoami:
    required_aal: aal1
    
cookies:
  same_site: Lax


# all the urls are commented out as i have already set them in the environment part of docker-compose file