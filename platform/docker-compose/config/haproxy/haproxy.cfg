global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE

frontend http_front
    bind *:80
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/server.pem

    # --- CORS CONFIGURATION (ADDED) ---
    # 1. Allow the Origin (Your React App) to connect
    http-response set-header Access-Control-Allow-Origin "*"
    
    # 2. Allow these Methods
    http-response set-header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    
    # 3. Allow these Headers (Critical for Authorization/JWT)
    http-response set-header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin"
    
    # 4. Handle the Browser's 'Pre-flight' check immediately
    #    This stops the browser from blocking the request.
    http-request return status 200 content-type "text/plain" string "CORS OK" if { method OPTIONS }
    # ----------------------------------

    acl is_health_check path_beg /health
    acl is_api_path path_beg /api
    acl is_oathkeeper_admin path_beg /oathkeeper
    acl is_kratos_public path_beg /self-service /sessions /.well-known
    acl is_kratos_admin path_beg /admin/identities /admin/schemas /recovery/link
    
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http unless { ssl_fc }
    http-request set-header X-Real-IP %[src]
    
    use_backend health_backend if is_health_check
    use_backend kratos_public if is_kratos_public
    use_backend kratos_admin if is_kratos_admin
    use_backend oathkeeper_admin if is_oathkeeper_admin
    use_backend oathkeeper_proxy if is_api_path
    default_backend oathkeeper_proxy

backend health_backend
    http-request return status 200 content-type "application/json" string "{\"status\":\"healthy\",\"service\":\"haproxy\"}"

backend oathkeeper_admin
    balance roundrobin
    option httpchk GET /health/ready
    http-request replace-path /oathkeeper(/)?(.*) /\2
    server oathkeeper1 taksa-oathkeeper:4456 check

backend oathkeeper_proxy
    balance roundrobin
    option tcp-check
    http-request set-header X-Forwarded-By HAProxy
    server oathkeeper1 taksa-oathkeeper:4455 check

backend kratos_public
    balance roundrobin
    option httpchk GET /health/ready
    http-request set-header X-Forwarded-By HAProxy
    server kratos1 taksa-kratos:4433 check inter 2000 rise 2 fall 3

backend kratos_admin
    balance roundrobin
    option httpchk GET /health/ready
    http-request set-header X-Forwarded-By HAProxy
    # IMPORTANT: Protect this endpoint - add IP whitelist or authentication
    server kratos1 taksa-kratos:4434 check inter 2000 rise 2 fall 3

backend direct_backend
    balance roundrobin
    server backend1 taksa-ui:8080 check

