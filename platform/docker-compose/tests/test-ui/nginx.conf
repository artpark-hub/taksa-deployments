server {
    listen 8080;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /public/ {
        default_type application/json;
        return 200 '{"status":"success","endpoint":"public","message":"Public endpoint"}';
    }

    location /protected/ {
        default_type application/json;
        return 200 '{"status":"success","endpoint":"protected","user":"$http_x_user"}';
    }

    location /health/ready {
        access_log off;
        return 200 '{"status":"ready"}';
        add_header Content-Type application/json;
    }

    location /validate {
        default_type application/json;
        if ($http_authorization = "") {
            return 401 '{"error":"missing_token"}';
        }
        return 200 '{"subject":"validated_user"}';
    }
}
