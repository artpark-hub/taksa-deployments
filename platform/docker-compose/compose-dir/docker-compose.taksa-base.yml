services:
  taksa-pg-db:
    image: postgres:18
    container_name: taksa-pg-db
    environment:
      - POSTGRES_USER=${TAKSA_PG_USER}
      - POSTGRES_PASSWORD=${TAKSA_PG_PASSWORD}
      - POSTGRES_DB=${TAKSA_PG_DB}
    volumes:
      - taksa-pg-data:/var/lib/postgresql
    networks:
      - taksa-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kratos-migrate:
    image: oryd/kratos:v1.2.0
    environment:
      - DSN=${KRATOS_DSN}
      #- DSN=postgres://kratos:secret@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
    volumes:
      - ../config/ory-stack/kratos:/etc/config/kratos
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    networks:
      - taksa-network
    depends_on:
      taksa-pg-db:
        condition: service_healthy

  taksa-kratos:
    image: oryd/kratos:v1.2.0
    container_name: taksa-kratos
    environment:
      - DSN=${KRATOS_DSN}
      - LOG_LEVEL=debug
      # all these urls below were set in the config file but now as we are using emv vard we initialize them here rather then im the config file 
      # Base URLs set to placeholder, HAProxy will inject X-Forwarded-* headers
      - SERVE_PUBLIC_BASE_URL=https://placeholder/
      - SERVE_ADMIN_BASE_URL=https://placeholder/
      - SESSION_COOKIE_DOMAIN=${TAKSA_DOMAIN}
      - SERVE_PUBLIC_CORS_ALLOWED_ORIGINS=https://${TAKSA_DOMAIN}:${KRATOS_PUBLIC_PORT},https://${TAKSA_DOMAIN}:${KRATOS_ADMIN_PORT},https://${TAKSA_DOMAIN}:${OATHKEEPER_PROXY_PORT},http://localhost:3000
      - SELFSERVICE_DEFAULT_BROWSER_RETURN_URL=https://${TAKSA_DOMAIN}:${KRATOS_PUBLIC_PORT}/
      - SELFSERVICE_ALLOWED_RETURN_URLS=https://${TAKSA_DOMAIN}:${KRATOS_PUBLIC_PORT},https://${TAKSA_DOMAIN}:${KRATOS_ADMIN_PORT},http://localhost:3000
      - SELFSERVICE_FLOWS_ERROR_UI_URL=https://${TAKSA_DOMAIN}:${KRATOS_PUBLIC_PORT}/error
      - SELFSERVICE_FLOWS_SETTINGS_UI_URL=/reset-password
      - SELFSERVICE_FLOWS_RECOVERY_UI_URL=/recovery
      - SELFSERVICE_FLOWS_LOGIN_UI_URL=/login
      - SELFSERVICE_FLOWS_REGISTRATION_UI_URL=/registration
      # SMTP Configuration for Email Recovery
      - COURIER_SMTP_CONNECTION_URI=${SMTP_CONNECTION_URI}
      - COURIER_SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS}
      - COURIER_SMTP_FROM_NAME=${SMTP_FROM_NAME}
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    volumes:
      - ../config/ory-stack/kratos:/etc/config/kratos
    networks:
      - taksa-network
    restart: unless-stopped
    depends_on:
      - kratos-migrate

  taksa-oathkeeper:
    image: oryd/oathkeeper:v0.40
    container_name: taksa-oathkeeper
    environment:
      - MUTATORS_ID_TOKEN_CONFIG_ISSUER_URL=https://${TAKSA_DOMAIN}:${OATHKEEPER_PROXY_PORT}

    command: serve -c /etc/config/oathkeeper/oathkeeper.yml
    volumes:
      - ../config/ory-stack/oathkeeper:/etc/config/oathkeeper
    networks:
      - taksa-network
    restart: unless-stopped
    depends_on:
      - taksa-kratos

  taksa-mailslurper:
    image: oryd/mailslurper:latest-smtps
    container_name: taksa-mailslurper
    networks:
      - taksa-network

  taksa-tsdb:
    image: timescale/timescaledb:latest-pg18
    container_name: taksa-tsdb
    environment:
      - POSTGRES_USER=${TSDB_PG_USER}
      - POSTGRES_PASSWORD=${TSDB_PG_PASSWORD}
      - POSTGRES_DB=${TSDB_PG_DB}
    volumes:
      - taksa-ts-data:/var/lib/postgresql
      - ../config/database/schemas:/docker-entrypoint-initdb.d:ro
    networks:
      - taksa-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  taksa-nats:
    image: nats:latest
    container_name: taksa-nats
    command: [ "-c", "/config/nats-server.conf" ]
    ports:
      - "${TAKSA_NATS_SERVER_PORT}:4222" # Client port
      - "${TAKSA_NATS_MONITOR_PORT}:8222" # HTTP Monitoring port
    environment:
      - NATS_SYS_USER=${TAKSA_NATS_SYS_USER}
      - NATS_SYS_PASSWORD=${TAKSA_NATS_SYS_PASSWORD}
      - NATS_APP_USER=${TAKSA_NATS_APP_USER}
      - NATS_APP_PASSWORD=${TAKSA_NATS_APP_PASSWORD}
    volumes:
      - ../config/nats/nats-server.conf:/config/nats-server.conf:ro
      - taksa-nats-data:/data

  taksa-apigateway:
    image: haproxy:3.2
    container_name: taksa-apigateway
    ports:
      - "80:80"
      - "443:443"
      - "8404:8404"
    volumes:
      - ../config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ../config/haproxy/errors:/usr/local/etc/haproxy/errors:ro
      - ../config/certs:/usr/local/etc/haproxy/certs:ro
    environment:
      - OATHKEEPER_HOST=taksa-oathkeeper
      - OATHKEEPER_PORT=4457
      - BACKEND_HOST=taksa-ui
      - BACKEND_PORT=3000
    networks:
      - taksa-network
    depends_on:
      - taksa-oathkeeper
    restart: unless-stopped

  taksa-ui:
    image: taksa-ui:latest
    container_name: taksa-ui
    environment:
      - NODE_ENV=production
    networks:
      - taksa-network
    restart: unless-stopped

  taksa-grafana:
    image: grafana/grafana:latest
    container_name: taksa-grafana
      #ports:
      #- "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://${TAKSA_DOMAIN}/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - TSDB_PG_DB=${TSDB_PG_DB}
      - TSDB_PG_USER=${TSDB_PG_USER}
      - TSDB_PG_PASSWORD=${TSDB_PG_PASSWORD}

    volumes:
      - taksa-grafana-data:/var/lib/grafana
      - ../config/grafana/provisioning:/etc/grafana/provisioning:ro

    networks:
      - taksa-network
    restart: unless-stopped
    depends_on:
      taksa-tsdb:
        condition: service_healthy

volumes:
  taksa-pg-data:
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '${TAKSA_DATADIR}/taksa/data/ory-db'
  taksa-ts-data:
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '${TAKSA_DATADIR}/taksa/data/timescale-db'
  taksa-nats-data:
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '${TAKSA_DATADIR}/taksa/data/nats-data'
  taksa-grafana-data:
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '${TAKSA_DATADIR}/taksa/data/grafana'

networks:
  taksa-network:
    driver: bridge
