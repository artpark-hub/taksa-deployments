services:
  taksa-ory-db:
    image: postgres:18
    container_name: taksa-ory-db
    command: -p ${KRATOS_PG_PORT}
    ports:
      - "${KRATOS_PG_PORT}:${KRATOS_PG_PORT}"
    environment:
      - POSTGRES_USER=${KRATOS_PG_USER}
      - POSTGRES_PASSWORD=${KRATOS_PG_PASSWORD}
      - POSTGRES_DB=${KRATOS_PG_DB}
      - PGPORT=${KRATOS_PG_PORT}
    volumes:
      - taksa-ory-data:/var/lib/postgresql
    networks:
      - taksa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  kratos-migrate:
    image: oryd/kratos:v1.2.0
    environment:
      - DSN=${KRATOS_DSN}
    volumes:
      - ../config/ory-stack/kratos:/etc/config/kratos
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    networks:
      - taksa-network
    depends_on:
      taksa-ory-db:
        condition: service_healthy

  taksa-kratos:
    image: oryd/kratos:v1.2.0
    container_name: taksa-kratos
    ports:
      - "${KRATOS_PUBLIC_PORT}:4433"
      - "${KRATOS_ADMIN_PORT}:4434"
    environment:
    - DSN=${KRATOS_DSN}
    - LOG_LEVEL=debug
    # Base URLs
    - SERVE_PUBLIC_BASE_URL=http://${TAKSA_DOMAIN}:${KRATOS_PUBLIC_PORT}/
    - SERVE_ADMIN_BASE_URL=https://${TAKSA_DOMAIN}:${KRATOS_ADMIN_PORT}/
    - SESSION_COOKIE_DOMAIN=${TAKSA_DOMAIN}
    # CORS
    - SERVE_PUBLIC_CORS_ALLOWED_ORIGINS=${UI_BASE_URL},https://${TAKSA_DOMAIN}:${KRATOS_PUBLIC_PORT},https://${TAKSA_DOMAIN}:${KRATOS_ADMIN_PORT},https://${TAKSA_DOMAIN}:${OATHKEEPER_PROXY_PORT}
    # Self-service URLs
    - SELFSERVICE_DEFAULT_BROWSER_RETURN_URL=${UI_BASE_URL}
    - SELFSERVICE_ALLOWED_RETURN_URLS=${UI_BASE_URL},http://${TAKSA_DOMAIN}:${KRATOS_PUBLIC_PORT},https://${TAKSA_DOMAIN}:${KRATOS_ADMIN_PORT}
    - SELFSERVICE_FLOWS_ERROR_UI_URL=http://${TAKSA_DOMAIN}:${KRATOS_PUBLIC_PORT}/error
    - SELFSERVICE_FLOWS_SETTINGS_UI_URL=${CORS_ALLOWED_ORIGINS}/reset-password
    - SELFSERVICE_FLOWS_RECOVERY_UI_URL=${CORS_ALLOWED_ORIGINS}/recovery
    - SELFSERVICE_FLOWS_LOGIN_UI_URL=${UI_BASE_URL}/login
    - SELFSERVICE_FLOWS_REGISTRATION_UI_URL=${UI_BASE_URL}/registration
    # NEW: SMTP Configuration for Email Recovery
    - COURIER_SMTP_CONNECTION_URI=${SMTP_CONNECTION_URI}
    - COURIER_SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS}
    - COURIER_SMTP_FROM_NAME=${SMTP_FROM_NAME}
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    volumes:
      - ../config/ory-stack/kratos:/etc/config/kratos
    networks:
      taksa-network:
        aliases:
          - kratos
    restart: unless-stopped
    depends_on:
      - kratos-migrate

  taksa-oathkeeper:
    image: oryd/oathkeeper:v0.40
    container_name: taksa-oathkeeper
    ports:
      - "${OATHKEEPER_PROXY_PORT}:4455"
      - "${OATHKEEPER_API_PORT}:4456"
    environment:
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - UI_BASE_URL=${UI_BASE_URL}
      - SERVE_PROXY_CORS_ENABLED=true
      - SERVE_PROXY_CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - SERVE_PROXY_CORS_ALLOWED_METHODS=GET,POST,PUT,PATCH,DELETE
      - SERVE_PROXY_CORS_ALLOWED_HEADERS=Authorization,Content-Type,X-Session-Token,Cookie
      - SERVE_PROXY_CORS_EXPOSED_HEADERS=Content-Type
      - SERVE_PROXY_CORS_ALLOW_CREDENTIALS=true
      - SERVE_PROXY_CORS_DEBUG=true
      - MUTATORS_ID_TOKEN_CONFIG_ISSUER_URL=https://${TAKSA_DOMAIN}:${OATHKEEPER_PROXY_PORT}
    command: serve -c /etc/config/oathkeeper/oathkeeper.yml 
    volumes:
      - ../config/ory-stack/oathkeeper:/etc/config/oathkeeper
    networks:
      - taksa-network
    restart: unless-stopped
    depends_on:
      - taksa-kratos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
  taksa-user-services:
    build:
      context: ../../../../taksa-platform-services/user-management
      dockerfile: Dockerfile
    image: taksa-user-services:latest
    container_name: taksa-user-services
    ports:
      - "8083:8083"
    depends_on:
      - taksa-kratos
      - taksa-ory-db
    networks:
      - taksa-network
    restart: unless-stopped

  taksa-mailslurper:
    image: oryd/mailslurper:latest-smtps
    container_name: taksa-mailslurper
    ports:
      - '4436:4436'
      - '4437:4437'
    networks:
      - taksa-network

  taksa-tsdb:
    image: timescale/timescaledb:latest-pg18
    container_name: taksa-tsdb
    command: -p ${TSDB_PG_PORT}
    ports:
      - "${TSDB_PG_PORT}:${TSDB_PG_PORT}"
    environment:
      - POSTGRES_USER=${TSDB_PG_USER}
      - POSTGRES_PASSWORD=${TSDB_PG_PASSWORD}
      - POSTGRES_DB=${TSDB_PG_DB}
      - PGPORT=${TSDB_PG_PORT}
    volumes:
      - taksa-ts-data:/var/lib/postgresql
      - ../config/database/schemas:/docker-entrypoint-initdb.d:ro
    networks:
      - taksa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  taksa-nats:
    image: nats:latest
    container_name: taksa-nats
    command: ["-c", "/config/nats-server.conf"]
    ports:
      - "${TAKSA_NATS_SERVER_PORT}:4222"
      - "${TAKSA_NATS_MONITOR_PORT}:8222"
    environment:
      - NATS_SYS_USER=${TAKSA_NATS_SYS_USER}
      - NATS_SYS_PASSWORD=${TAKSA_NATS_SYS_PASSWORD}
      - NATS_APP_USER=${TAKSA_NATS_APP_USER}
      - NATS_APP_PASSWORD=${TAKSA_NATS_APP_PASSWORD}
    volumes:
      - ../config/nats/nats-server.conf:/config/nats-server.conf:ro
      - taksa-nats-data:/data
    networks:
      - taksa-network

  taksa-apigateway:
    image: haproxy:3.2
    container_name: taksa-apigateway
    ports:
      - "80:80"
      - "443:443"
      - "8404:8404"
    volumes:
      - ../config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ../config/haproxy/errors:/usr/local/etc/haproxy/errors:ro
      - ../config/certs:/usr/local/etc/haproxy/certs:ro
    networks:
      - taksa-network
    depends_on:
      - taksa-oathkeeper
    restart: unless-stopped

  taksa-ui:
    image: nginx:alpine
    container_name: taksa-ui
    volumes:
      - ../tests/test-ui/index.html:/usr/share/nginx/html/index.html:ro
      - ../tests/test-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - taksa-network
    restart: unless-stopped

volumes:
  taksa-ory-data:
   driver_opts:
     type: 'none'
     o: 'bind'
     device: '${TAKSA_DATADIR}/taksa/data/ory-db'
  taksa-ts-data:
   driver_opts:
     type: 'none'
     o: 'bind'
     device: '${TAKSA_DATADIR}/taksa/data/timescale-db'
  taksa-nats-data:
   driver_opts:
     type: 'none'
     o: 'bind'
     device: '${TAKSA_DATADIR}/taksa/data/nats-data'

networks:
  taksa-network:
    driver: bridge